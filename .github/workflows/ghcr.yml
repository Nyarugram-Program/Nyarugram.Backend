name: Backend CI and GHCR

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: botgram_test
          POSTGRES_DB: botgram_test_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botgram_test -d botgram_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      BOTGRAM_TEST_DLL: ${{ github.workspace }}/bin/Release/net8.0/Botgram.Backend.dll
      BOTGRAM_E2EE_PG: 'Host=127.0.0.1;Port=5432;Database=botgram_test_ci;Username=botgram_test'
      BOTGRAM_PSQL: psql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Release
        run: |
          dotnet build -c Release --nologo
          dotnet build Storage.Admin/Storage.Admin.csproj -c Release --nologo
      - name: Initialize isolated PostgreSQL schema v9
        run: |
          cat > "$RUNNER_TEMP/pg-ci.json" <<'JSON'
          {
            "Storage": {
              "Mode": "NewStorageValidation",
              "ValidationAcknowledged": true,
              "ValidationBackend": "RelationalBackend",
              "ValidationConnectionString": "Host=127.0.0.1;Port=5432;Database=botgram_test_ci;Username=botgram_test"
            }
          }
          JSON
          dotnet Storage.Admin/bin/Release/net8.0/Storage.Admin.dll init "$RUNNER_TEMP/pg-ci.json"
      - name: Validate pinned M49 data
        run: node tests/m49.mjs
      - name: Verify every retired JSON route and JSON WSS negotiation
        run: node tests/json-retirement.mjs
      - name: Legacy GID suite verifies retirement and offline M49 data
        run: node tests/gid.mjs
      - name: Legacy smoke suite verifies retirement without side effects
        run: node tests/smoke.mjs
      - name: Legacy TL-JSON RPC boundaries verify retirement
        run: node tests/rpc-boundaries.mjs
      - name: Protobuf authentication, account security and ordinary chat
        run: node tests/protobuf-business.mjs
      - name: Protobuf authentication and chat against PostgreSQL authority
        env:
          BOTGRAM_BUSINESS_POSTGRES: '1'
        run: node tests/protobuf-business.mjs
      - name: Directional E2EE regression (legacy file authority)
        run: node tests/e2ee.mjs
      - name: Directional E2EE regression (real PostgreSQL authority)
        env:
          BOTGRAM_E2EE_POSTGRES: '1'
        run: node tests/e2ee.mjs
      - name: PostgreSQL E2EE concurrency, rollback and replay regression
        run: node tests/postgres-e2ee-concurrency.mjs
      - name: PostgreSQL storage contracts, delivery fencing and capacity
        env:
          BOTGRAM_PG_TEST_CONNECTION_STRING: 'Host=127.0.0.1;Port=5432;Database=botgram_test_ci;Username=botgram_test'
        run: dotnet run --no-build -c Release --project Storage.Tests
      - name: Initialize dedicated outbox-completion database
        run: |
          psql -h 127.0.0.1 -U botgram_test -d postgres -c 'CREATE DATABASE botgram_test_outbox'
          cat > "$RUNNER_TEMP/pg-outbox.json" <<'JSON'
          {
            "Storage": {
              "Mode": "NewStorageValidation",
              "ValidationAcknowledged": true,
              "ValidationBackend": "RelationalBackend",
              "ValidationConnectionString": "Host=127.0.0.1;Port=5432;Database=botgram_test_outbox;Username=botgram_test"
            }
          }
          JSON
          dotnet Storage.Admin/bin/Release/net8.0/Storage.Admin.dll init "$RUNNER_TEMP/pg-outbox.json"
      - name: PostgreSQL single-authority outbox completion lifecycle
        env:
          BOTGRAM_E2EE_PG: 'Host=127.0.0.1;Port=5432;Database=botgram_test_outbox;Username=botgram_test'
        run: node tests/relational-outbox.mjs
      - name: Protobuf schema fingerprint and frozen fixtures
        run: |
          node tests/proto-fingerprint.cjs
          node tests/frozen-kafka-source.cjs

  image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image and push outside pull requests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=docker,dest=${{ runner.temp }}/botgram-backend-image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload deployable image archive
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ github.sha }}
          path: ${{ runner.temp }}/botgram-backend-image.tar
          compression-level: 1
          retention-days: 3
